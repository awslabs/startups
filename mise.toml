# mise.toml - Tool versions and tasks for awslabs/startups
# See: https://mise.jdx.dev

min_version = "2026.2.4"

[tools]
node = "24"
terraform = "1.13"
"npm:markdownlint-cli2" = "0.17"
"npm:dprint" = "0.51"
"npm:typescript" = "5"
"pipx:pre-commit" = "4"
"pipx:bandit[sarif]" = "1"
"pipx:checkov" = "3"
"pipx:semgrep" = "1.151.0"
"grype" = "0.107.1"
"gitleaks" = "8.30.0"

# ==================
# ROOT LEVEL TASKS
# ==================

[tasks.pre-commit]
description = "Run pre-commit"
run = ["pre-commit run --all-files"]

# ======================
# LINTING & FORMATTING
# ======================

[tasks.fmt]
description = "Format all files"
run = "dprint fmt"

[tasks."fmt:check"]
description = "Check formatting (CI)"
run = "dprint check"

[tasks."lint:md"]
description = "Lint Markdown files"
run = "markdownlint-cli2 '**/*.md' '#node_modules' '#.git'"

[tasks."lint:md:fix"]
description = "Lint Markdown files with auto-fix"
run = "markdownlint-cli2 '**/*.md' '#node_modules' --fix"

[tasks."lint:frontmatter"]
description = "Validate phase/fragment/assembler frontmatter (typed, zero-dep; skill-agnostic) for both plugins"
run = [
  "node migrate/plugins/migration-to-aws/tools/frontmatter-validator/validate.ts migrate/plugins/migration-to-aws/skills/heroku-to-aws",
  "node migrate/plugins/migration-to-aws/tools/frontmatter-validator/validate.ts migrate/plugins/migration-to-aws/skills/agent-advisor",
  "node migrate/plugins/migration-to-aws/tools/frontmatter-validator/validate.ts migrate/plugins/migration-to-aws/skills/gcp-to-aws",
  "node advisor/plugins/aws-startup-advisor/tools/frontmatter-validator/validate.ts advisor/plugins/aws-startup-advisor/skills/heroku-to-aws",
  "node advisor/plugins/aws-startup-advisor/tools/frontmatter-validator/validate.ts advisor/plugins/aws-startup-advisor/skills/agent-advisor",
  "node advisor/plugins/aws-startup-advisor/tools/frontmatter-validator/validate.ts advisor/plugins/aws-startup-advisor/skills/gcp-to-aws",
]

[tasks."lint:types"]
description = "Type-check the frontmatter validator + its test (tsc --noEmit, strict) for both plugins"
run = [
  "cd migrate/plugins/migration-to-aws && tsc --noEmit",
  "cd advisor/plugins/aws-startup-advisor && tsc --noEmit",
]

[tasks.test]
description = "Run contract, frontmatter-validator, and focused cross-plugin generation regression suites (node --test)"
run = [
  "node --test migrate/plugins/migration-to-aws/tests/tools/application-source-contract.test.ts",
  "node --test migrate/plugins/migration-to-aws/tests/tools/frontmatter-validator.test.ts",
  "node --test advisor/plugins/aws-startup-advisor/tests/tools/frontmatter-validator.test.ts",
  "node --test tests/heroku-eb-runtime-settings.test.ts",
]

[tasks."lint:model-ids"]
description = "Fail on known-bad Bedrock model IDs (EOL-as-target, fabricated dated forms) outside the catalog files (CI) — both plugins"
run = [
  "python3 migrate/plugins/migration-to-aws/tools/model-id-lint.py",
  "python3 advisor/plugins/aws-startup-advisor/tools/model-id-lint.py",
]

[tasks."fixtures:assert"]
description = "Run committed fixture asserters: golden run trees must PASS, replay-only asserters must fail cleanly on an empty dir (CI) for both plugins"
run = [
  "python3 migrate/plugins/migration-to-aws/tools/run-asserters.py",
  "python3 advisor/plugins/aws-startup-advisor/tools/run-asserters.py",
]

[tasks."shared:sync"]
description = "Sync each skill's references/vendored/ tree from the canonical skills/shared/ source (both plugins)"
run = [
  "node migrate/plugins/migration-to-aws/tools/sync-vendored-shared.ts --write",
  "node advisor/plugins/aws-startup-advisor/tools/sync-vendored-shared.ts advisor/plugins/aws-startup-advisor --write",
]

[tasks."shared:check"]
description = "Verify each skill's vendored shared files are byte-identical to canonical skills/shared/ (CI) for both plugins"
run = [
  "node migrate/plugins/migration-to-aws/tools/sync-vendored-shared.ts",
  "node advisor/plugins/aws-startup-advisor/tools/sync-vendored-shared.ts advisor/plugins/aws-startup-advisor",
]

[tasks."drift:check"]
description = "Fail if the migrate + advisor copies of a shared skill tree drift apart (a fix landed on one side only). Normalizes the intentional prefix/path/schema-id differences; allowlists deliberate prose divergence."
run = "node advisor/plugins/aws-startup-advisor/tools/cross-plugin-drift.ts"

[tasks."fixtures:check"]
description = "Structural integrity of committed replay fixtures (JSON parse, asserter byte-compile, manifest file references, gitignore traps, seed phase-status vs declared phases) for both plugins"
run = [
  "node migrate/plugins/migration-to-aws/tools/fixtures-check.ts",
  "node advisor/plugins/aws-startup-advisor/tools/fixtures-check.ts . advisor/plugins/aws-startup-advisor",
]

[tasks."pricing:staleness"]
description = "Report pricing caches past their own declared freshness window (warn-only; use --strict in a scheduled workflow to fail) for both plugins"
run = [
  "node migrate/plugins/migration-to-aws/tools/pricing-staleness.ts",
  "node advisor/plugins/aws-startup-advisor/tools/pricing-staleness.ts advisor/plugins/aws-startup-advisor",
]

[tasks.lint]
description = "Run all linters"
run = [
  { task = "lint:md" },
  { task = "lint:types" },
  { task = "lint:frontmatter" },
  { task = "lint:model-ids" },
  { task = "shared:check" },
  { task = "drift:check" },
  { task = "fixtures:assert" },
  { task = "fixtures:check" },
  { task = "pricing:staleness" },
  { task = "test" },
]

# =========
# SECURITY
# =========

[tasks."security:bandit"]
description = "Run Bandit (per-plugin skip configs for migration-to-aws and aws-startup-advisor; rest of repo with full strictness — mirrors the CI bandit job in .github/workflows/security-scanners.yml)"
run = [
  "bandit -r migrate/plugins/migration-to-aws -c migrate/plugins/migration-to-aws/bandit.yml -x migrate/plugins/migration-to-aws/skills/agent-advisor/scripts/.venv,migrate/plugins/migration-to-aws/skills/llm-to-bedrock/scripts/.venv,migrate/plugins/migration-to-aws/tests",
  "bandit -r advisor/plugins/aws-startup-advisor -c advisor/plugins/aws-startup-advisor/bandit.yml -x advisor/plugins/aws-startup-advisor/skills/agent-advisor/scripts/.venv,advisor/plugins/aws-startup-advisor/skills/llm-to-bedrock/scripts/.venv,advisor/plugins/aws-startup-advisor/tests",
  "bandit -r . --exclude ./.tmp,./node_modules,./migrate/plugins/migration-to-aws,./advisor/plugins/aws-startup-advisor",
]

[tasks."security:semgrep"]
description = "Run SemGrep OSS"
run = [
  "semgrep scan --quiet --oss-only --metrics=off --config=r/all --max-log-list-entries=0 --exclude-rule='ai.generic.detect-generic-ai-anthprop.detect-generic-ai-anthprop' --exclude-rule='ai.generic.detect-generic-ai-oai.detect-generic-ai-oai'",
]

[tasks."security:checkov"]
description = "Run Checkov"
run = ["checkov --quiet --directory ."]

[tasks."security:gitleaks"]
description = "Run GitLeaks"
run = ["gitleaks git --config=.gitleaks.toml --baseline-path=.gitleaks-baseline.json"]

[tasks."security:grype"]
description = "Run Grype"
run = ["grype ."]

[tasks.security]
description = "Run security scans"
run = [
  { task = "security:bandit" },
  { task = "security:semgrep" },
  { task = "security:gitleaks" },
  { task = "security:checkov" },
  { task = "security:grype" },
]

# ===============
# BUILD PROCESS
# ===============

[tasks.build]
description = "Complete build: lint, format, security scans"
run = [
  { task = "lint" },
  { task = "fmt:check" },
  { task = "security" },
]
