[pytest]
# Tests live next to the code they exercise, under scripts/ (test_*.py). Adding
# scripts/ to pythonpath lets the test modules import the deterministic core by
# bare module name (import topology_source) without a sys.path hack per file.
testpaths = scripts
pythonpath = scripts
markers =
    network: test requires network access and/or live AWS credentials (skipped in offline runs)
