name: Reviewer Safety

# Asserts the invariants that let `agentcore-reviewer.yml` run on `pull_request_target`.
# That trigger hands base-repository credentials to a job whose inputs a contributor
# controls, which is acceptable only while both of these hold:
#
#   1. Contributor code is never fetched into the credentialed runner. The runtime reads
#      the diff through the API instead.
#   2. No fork-controlled value reaches a shell.
#
# Losing either is a credential exposure rather than a broken build, and it would read as
# an ordinary edit in review, so the invariants are asserted rather than left to a comment.
#
# The assertion is an ALLOWLIST over the parsed YAML, in
# `tools/reviewer-guard/reviewer_guard.py`, not a search for bad patterns. It has been
# broken twice and rewritten twice, and the fixture corpus is the record of both rounds.
#
# Round one, two greps: sixteen hostile workflows, fifteen passed, and the one rejected was
# the safe `env:`-indirection pattern its own error message recommended.
# `uses: "actions/checkout@v4"` beat an anchored pattern, a folded scalar beat it again,
# and `${{ format('{0}', ...title) }}` beat a `[^}]*` class that cannot cross the `}` in
# `{0}`. Indirection beat it wholesale.
#
# Round two, the first allowlist: one denylist had been left inside it, so a step reading
# as an ordinary caching optimisation still passed. Shell bodies are now pinned by sha256,
# so any edit to a script fails until the hash is updated and that hash change is the
# review artifact.
# Enumerating bad YAML is unwinnable, so the guard enumerates good YAML and anything
# unrecognised fails closed. Every hostile file is kept as a fixture and the guard is
# re-proved against all of them on every run.
#
# The guard and its fixtures live in `tools/reviewer-guard/`, deliberately outside
# `.github/workflows/`, and the fixtures carry a `.yml.fixture` extension. They are hostile
# workflows by construction, so while they sat under `.github/workflows/` every workflow
# scanner in CI read them as real pipelines and failed on exactly the shell injection and
# `curl`-with-secrets they are built to contain.
#
# This is its own workflow rather than a step in the contribution gate, and it checks two
# refs. Both were raised on awslabs/startups#259:
#
#   - The gate is filtered on `paths: solution-architecture/**`, so a pull request
#     touching only `.github/workflows/` never triggered it: the guard could not fire on
#     the change class it exists to catch, and CONTRIBUTING lists that class as
#     RFC-exempt. This workflow has no path filter.
#   - Checking one ref answers the wrong question. The head copy is what this pull request
#     proposes, so it must be checked or nothing blocks the change that removes an
#     invariant. The default branch copy is what a fork's `pull_request_target` run
#     actually loads, so it is checked for drift. Reading the head as data is safe because
#     nothing in it is executed.
# KNOWN LIMIT, recorded rather than papered over. This workflow runs on `pull_request`,
# so its own definition comes from the pull request's merge ref: a change to THIS file is
# checked by the changed copy. Editing `TARGET`, appending `exit 0`, or deleting the file
# all report green. Two things outside this file are what actually close it, and both must
# stay in place:
#
#   - `.github/CODEOWNERS` routes `/.github/` to the admins team, so any edit here needs
#     their review.
#   - This check should be marked required in branch protection, so deleting the workflow
#     registers as a missing required check rather than as silence.
#
# A self-check inside the file cannot fix this, because the attacker edits the checker.
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reviewer-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assert:
    name: Reviewer workflow invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Both refs, because they answer different questions and the previous version
      # answered neither well.
      #
      # HEAD gates this pull request: it is the copy being proposed, so a change that adds
      # a checkout or a fork-controlled interpolation fails here rather than after merge.
      # Reading the head as DATA is safe; nothing from it is executed.
      #
      # The DEFAULT BRANCH is what a fork's `pull_request_target` run actually loads, per
      # GitHub's events reference, so it is checked for drift. `base.ref` would be wrong
      # for any pull request targeting a non-default branch.
      - name: Fetch the default branch copy of the reviewer workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p .guard
          # `// empty` so a missing key yields an empty file the guard rejects, rather
          # than jq printing the string "null" and base64 decoding it to 3 bytes of
          # garbage that a size check would accept.
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/agentcore-reviewer.yml" \
            -f ref="${DEFAULT_BRANCH}" --jq '.content // empty' \
            | base64 -d > .guard/default-branch-reviewer.yml
          echo "Fetched the ${DEFAULT_BRANCH} copy, $(wc -c < .guard/default-branch-reviewer.yml) bytes."

      - name: Assert the reviewer stays safe under pull_request_target
        run: |
          set -euo pipefail
          python3 tools/reviewer-guard/reviewer_guard.py \
            .github/workflows/agentcore-reviewer.yml \
            .guard/default-branch-reviewer.yml
          {
            echo "### Reviewer workflow invariants"
            echo ""
            echo "Both the proposed copy and the default branch copy satisfy the allowlist:"
            echo "every \`uses:\` is pinned and permitted, every \`\${{ }}\` expression is"
            echo "permitted, and no shell fetches the pull request."
          } >> "$GITHUB_STEP_SUMMARY"

      # Proves the guard still rejects what it is for. A guard that only ever passes is
      # indistinguishable from one that is broken, which is how its predecessor shipped
      # while 15 of 16 hostile workflows walked through it.
      - name: Prove the guard rejects known bypasses
        run: |
          set -euo pipefail
          failures=0
          for fixture in tools/reviewer-guard/fixtures/*.yml.fixture; do
            if python3 tools/reviewer-guard/reviewer_guard.py "$fixture" >/dev/null 2>&1; then
              echo "::error::guard accepted known-bad fixture $fixture" >&2
              failures=$((failures + 1))
            fi
          done
          # The positive control is the real workflow, not a synthetic baseline. Once shell
          # bodies are pinned by hash, only the actual reviewer can pass, so a fixture that
          # merely looks safe is correctly rejected too and cannot serve as the control.
          if ! python3 tools/reviewer-guard/reviewer_guard.py \
            .github/workflows/agentcore-reviewer.yml >/dev/null 2>&1; then
            echo "::error::guard rejected the real reviewer workflow; the allowlist and the workflow have drifted apart" >&2
            failures=$((failures + 1))
          fi
          [ "$failures" -eq 0 ] && echo "Guard rejects every known bypass and accepts the real workflow."
          exit "$failures"
